name: Gráfico 3D de contribuições

# Gera os SVGs em profile-3d-contrib/ (inclusive o profile-night-rainbow.svg
# que o README usa) e commita na branch main.
# Correções: só commita se algo mudou (antes o passo falhava quando não
# havia mudança), só adiciona a pasta do gráfico (antes era `git add -A .`)
# e usa versões atuais das actions.

on:
  schedule:
    # todo dia às 02:00 UTC (23:00 de Brasília do dia anterior)
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: "100"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: atualiza gráfico 3D de contribuições"; then
            git push
          else
            echo "nada mudou"
          fi
